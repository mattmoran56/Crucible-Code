name = "codecrucible-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Static SPA — receiver build dropped into ./public at deploy time.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Existence registry: handle -> 1 (with TTL on the entry to mirror DO alarm).
# Worker checks this before instantiating a Room DO, so unknown handles can't
# spawn free DOs.
[[kv_namespaces]]
binding = "HANDLE_REGISTRY"
id = "eec0512da1924d4e996c5eeff3594bd9"

# Native Workers Rate Limiting API — Cloudflare-managed, no DO state to
# worry about. Period must be 10 or 60 seconds.
[[unsafe.bindings]]
name = "REGISTER_RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "PHONE_RL"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# SQLite-backed DO storage. Required for new DO classes on the Workers Free
# plan; harmless on Paid.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimit"]

# v3: switched rate-limiting to the native Workers binding and dropped the
# RateLimit DO class.
[[migrations]]
tag = "v3"
deleted_classes = ["RateLimit"]
